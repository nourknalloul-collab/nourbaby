<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MamSteps — خطوة بخطوة، من أول نبضة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDF6F2; --ink:#4A3B38; --ink-soft:#9A8781;
  --accent:#E0918F; --accent-soft:#FBE9E6;
  --sage:#9DBFAE; --danger:#D0645C;
  --card:#FFFFFF; --line:#F2E4DF;
  --shadow:0 4px 20px rgba(160,110,100,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.7}
#root{max-width:520px;margin:0 auto;min-height:100vh;position:relative}

.screen{padding:22px 18px 100px}
.center-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px}

h1{font-size:30px;font-weight:700;letter-spacing:-.5px}
h2{font-size:21px;font-weight:700;margin-bottom:4px}
.muted{color:var(--ink-soft);font-size:15px}
.tiny{font-size:13px;color:var(--ink-soft)}

.brand{font-size:44px;font-weight:700;color:var(--accent);text-align:center;letter-spacing:-1px}
.brand-sub{text-align:center;color:var(--ink-soft);margin-bottom:34px;font-size:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}

label{display:block;font-size:14px;color:var(--ink-soft);margin-bottom:7px;font-weight:500}
input,textarea,select{width:100%;font-family:inherit;font-size:16px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:16px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:130px;line-height:1.9}

.btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;
  padding:15px;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:10px}
.btn:disabled{opacity:.45}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line)}
.btn-sage{background:var(--sage)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-sm{padding:10px;font-size:15px;width:auto;flex:1}

.row{display:flex;gap:9px}
.pill{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 8px;
  font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;text-align:center}
.pill[data-on="1"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

/* الشاشة الرئيسية */
.hero{background:linear-gradient(160deg,var(--accent-soft),#fff);
  border:1px solid var(--line);border-radius:22px;padding:26px 20px;text-align:center;
  margin-bottom:14px;box-shadow:var(--shadow)}
.week-num{font-size:60px;font-weight:700;color:var(--accent);line-height:1}
.size-note{font-size:19px;font-weight:500;margin-top:8px}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:18px 0 8px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}

.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:15px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;color:var(--accent)}
.stat span{font-size:12px;color:var(--ink-soft)}

.letter{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;
  box-shadow:var(--shadow);margin-bottom:14px}
.letter p{font-size:17.5px;line-height:2.1;white-space:pre-wrap}
.letter .from{margin-top:16px;font-size:14px;color:var(--accent);font-weight:700}

.saved{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:14px;
  padding:15px;margin-bottom:10px}
.saved .meta{font-size:12px;color:var(--ink-soft);margin-bottom:6px}
.locked{filter:blur(5px);user-select:none}

.plan{border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;background:#fff}
.plan[data-on="1"]{border-color:var(--accent);background:var(--accent-soft)}
.plan .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.plan .price{font-size:22px;font-weight:700;color:var(--accent)}
.plan ul{list-style:none;font-size:14px;color:var(--ink-soft)}
.plan li{padding-right:16px;position:relative;margin-bottom:3px}
.plan li:before{content:"•";position:absolute;right:0;color:var(--accent)}

.alert{border-radius:14px;padding:14px;font-size:15px;margin-bottom:14px}
.alert-warn{background:#FDF0ED;border:1px solid var(--danger);color:var(--danger)}
.alert-ok{background:#EFF5F3;border:1px solid var(--sage);color:#4A7266}
.alert-info{background:var(--accent-soft);border:1px solid var(--accent);color:#8A6A22}

.tabs{position:fixed;bottom:0;right:0;left:0;max-width:520px;margin:0 auto;
  background:#fff;border-top:1px solid var(--line);display:flex;padding:9px 4px 14px;z-index:50}
.tab{flex:1;background:none;border:none;font-family:inherit;font-size:12px;
  color:var(--ink-soft);cursor:pointer;padding:5px 2px}
.tab i{display:block;font-size:21px;font-style:normal;margin-bottom:2px;opacity:.5}
.tab[data-on="1"]{color:var(--accent);font-weight:700}
.tab[data-on="1"] i{opacity:1}

.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite;margin:32px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.req{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}




/* ===== شعار وهوية MamSteps ===== */
.ms-logo{width:96px;height:110px;margin:0 auto 6px;display:block}
.ms-name{font-family:'Amiri',serif;font-size:46px;font-weight:400;
  color:#9C6B4F;text-align:center;letter-spacing:1px;line-height:1.1}
.ms-sub{text-align:center;color:#8C6E5E;font-size:15px;margin-top:0}
.ms-logo-img{width:210px;max-width:56%;height:auto;margin:0 auto -6px;display:block}

/* ===== شاشة الترحيب ===== */
.lp-shell{position:relative;width:100%;flex:1;display:flex;
  flex-direction:column;justify-content:flex-end}
.lp{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;
  background:#F7EDE5;display:flex;flex-direction:column;justify-content:flex-end}

/* الصورة كاملة تملأ الشاشة */
.lp-art{position:absolute;inset:0;background-size:cover;
  background-position:center top;background-repeat:no-repeat;
  animation:rise .6s ease both}
@keyframes rise{from{opacity:0}to{opacity:1}}

/* الأزرار فوق الجزء الفاتح أسفل الصورة */
.lp-actions{position:relative;z-index:2;width:100%;max-width:480px;
  margin-inline:auto;padding:0 24px calc(20px + env(safe-area-inset-bottom))}

.lp-oauth{width:100%;background:#fff;border:none;border-radius:15px;padding:13px;
  font-family:'Tajawal',sans-serif;font-size:15px;color:#4A3B38;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 6px 20px rgba(140,100,80,.15)}
.lp-oauth:hover{background:#FFFCFA}
.lp-or{display:flex;align-items:center;gap:12px;color:#96806F;font-size:12.5px;margin:11px 0 9px}
.lp-or:before,.lp-or:after{content:"";flex:1;height:1px;background:#E4CFC2}
.lp-mailbtn{width:100%;background:rgba(253,236,231,.94);border:1px solid #EFD3C9;
  border-radius:14px;padding:13px;font-family:'Tajawal',sans-serif;font-size:15px;
  color:#B4736E;font-weight:500;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:9px}
.lp-mailbtn:hover{background:#FFF5F1}
.lp-swap{display:block;margin:10px auto 0;background:none;border:none;
  font-family:'Tajawal',sans-serif;font-size:14px;color:#8A7365;cursor:pointer;
  padding:7px 14px;border-radius:99px}
.lp-swap:hover{background:rgba(255,255,255,.55);color:#4A3B38}
.lp-terms{text-align:center;font-size:11px;color:#8E7A6C;line-height:1.8;margin-top:10px}

@media(min-width:820px){
  .lp{align-items:center;justify-content:center;background:#EFE0D4}
  .lp-shell{position:relative;width:min(420px,calc((100vh - 30px) * 0.686));
    height:min(calc(100vh - 30px),calc(420px / 0.686));border-radius:24px;
    overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
    box-shadow:0 20px 56px -30px rgba(90,60,40,.5)}
  .lp-actions{max-width:none;padding:0 20px 20px}
}
@media(prefers-reduced-motion:reduce){.lp-art{animation:none}}

/* ===== الشاشة الرئيسية الجديدة ===== */
.hm-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.hm-hi{font-size:22px;font-weight:700;color:#4A3B38}
.hm-hi span{color:#E0918F}
.hm-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);
  display:grid;place-items:center;font-size:22px;flex:none}

.ring-wrap{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring-mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-lbl{font-size:13px;color:var(--ink-soft)}
.ring-num{font-size:44px;font-weight:700;color:var(--accent);line-height:1}
.ring-of{font-size:12px;color:var(--ink-soft)}

.hm-visual{flex:1;aspect-ratio:1;border-radius:24px;overflow:hidden;
  background:linear-gradient(150deg,var(--accent-soft),#fff);
  display:grid;place-items:center;position:relative}
.hm-visual img{width:100%;height:100%;object-fit:cover}
.hm-size{position:absolute;bottom:10px;inset-inline-start:0;inset-inline-end:0;
  text-align:center;font-size:14px;color:var(--ink);font-weight:500}

.hm-days{display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:15px;color:var(--ink-soft);margin-bottom:20px}
.hm-days b{color:var(--accent);font-size:18px}

.hm-card{border-radius:22px;padding:20px;margin-bottom:14px;position:relative;
  overflow:hidden;box-shadow:var(--shadow)}
.hm-letter{background:linear-gradient(120deg,var(--accent-soft) 0%,#FFF9F8 72%);
  border:1px solid var(--line)}
.hm-card h3{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:8px}
.hm-card p{font-size:16px;line-height:1.95;color:var(--ink-soft)}
.hm-btn{margin-top:14px;background:var(--accent);color:#fff;border:none;
  border-radius:99px;padding:12px 26px;font-family:inherit;font-size:15px;
  font-weight:700;cursor:pointer}
.hm-btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}

.hm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.hm-tile{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:16px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
.hm-tile:hover{border-color:var(--accent)}
.hm-ico{width:48px;height:48px;border-radius:50%;margin:0 auto 10px;
  display:grid;place-items:center;font-size:22px}
.hm-tile b{display:block;font-size:15.5px;color:var(--ink)}
.hm-tile span{font-size:13px;color:var(--ink-soft)}

/* ===== قائمة الموبايل المنسدلة ===== */
.menu-btn{display:none}
@media(max-width:899px){
  .tabs{gap:2px;padding:9px 2px 14px}
  .tab{font-size:11px;padding:5px 1px}
  .tab i{font-size:19px}
  .tab.extra{display:none}
  .menu-btn{display:block}
  .drawer{position:fixed;inset:0;background:rgba(44,62,80,.5);z-index:150}
  .drawer-panel{position:absolute;top:0;bottom:0;right:0;width:74%;max-width:290px;
    background:#fff;padding:26px 16px;overflow-y:auto;
    box-shadow:-4px 0 22px rgba(44,62,80,.14)}
  .drawer-panel h3{font-size:24px;color:var(--accent);padding:0 12px 18px;font-weight:700}
  .drawer-item{width:100%;display:flex;align-items:center;gap:12px;background:none;
    border:none;font-family:inherit;font-size:16px;color:var(--ink);text-align:start;
    padding:14px 12px;border-radius:12px;cursor:pointer}
  .drawer-item i{font-style:normal;font-size:20px}
  .drawer-item[data-on="1"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .drawer-sep{font-size:12px;color:var(--ink-soft);padding:16px 12px 6px;font-weight:700}
}
@media(min-width:900px){
  .drawer{display:none}
  .menu-btn{display:none!important}
  .tab.extra{display:flex}
}

/* ===== لابتوب: قائمة جانبية ثابتة على اليمين ===== */
@media(min-width:900px){
  html,body{overflow-x:hidden}
  #root{max-width:none;display:block;width:auto;
    margin-right:260px;margin-left:0;padding:0}
  .screen{max-width:820px;margin:0 auto;padding:34px 30px 70px}
  .center-screen{max-width:520px;margin:0 auto}

  .tabs{position:fixed;top:0;bottom:0;right:0;left:auto;width:260px;max-width:none;
    margin:0;flex-direction:column;gap:4px;overflow-y:auto;
    border-top:none;border-left:1px solid var(--line);
    padding:28px 14px;background:#fff;z-index:60}

  .tabs:before{content:"MamSteps";display:block;font-size:24px;font-weight:700;
    color:var(--accent);padding:0 14px 20px;letter-spacing:-1px}

  .tab{flex:none;display:flex;align-items:center;gap:11px;width:100%;
    text-align:right;font-size:15.5px;padding:12px 14px;border-radius:12px}
  .tab i{margin:0;font-size:19px}
  .tab:hover{background:var(--accent-soft)}
  .tab[data-on="1"]{background:var(--accent-soft)}
  .nav-sep{font-size:12px;color:var(--ink-soft);padding:16px 14px 6px;font-weight:700}

  .stats{gap:14px}
  .row{gap:12px}
  .admin-pills{display:none}
}
.nav-sep{display:none}
</style>
</head>

<script type="text/plain" id="src">
const { useState, useEffect, useRef } = React;

const SUPABASE_URL = "https://bxoraepjhbpmtkspiwqw.supabase.co";

const DAY = 86400000;

const PLAN_INFO = {
  basic:    { name:"الاساسية", items:["الرسالة الاسبوعية من جنينك","صندوق صندوق الرسائل","عدّاد الركلات والطلق","حقيبة المستشفى"] },

};

/* ---------- أدوات ---------- */
function weekFrom(due){
  if(!due) return 1;
  const left = Math.ceil((new Date(due) - new Date()) / DAY);
  const w = 40 - Math.ceil(left / 7);
  return Math.min(42, Math.max(1, w + 1));
}
function daysLeft(due){
  if(!due) return 0;
  return Math.max(0, Math.ceil((new Date(due) - new Date()) / DAY));
}
function dueFromLmp(lmp){
  const d = new Date(lmp);
  d.setDate(d.getDate() + 280);
  return d.toISOString().slice(0,10);
}
function fillName(text, name){
  return (text||"").replace(/\{\{name\}\}/g, name ? " " + name : "");
}
function accentFor(gender){
  if(gender === "boy")  return "#7FA9C9";
  if(gender === "girl") return "#E28FA0";
  return "#E0918F";
}
function softFor(gender){
  if(gender === "boy")  return "#EAF2F8";
  if(gender === "girl") return "#FCEBEF";
  return "#FBE9E6";
}

function Auth({ initial, onBack }){
  const [mode,setMode] = useState(initial || "in");
  const [email,setEmail] = useState("");
  const [pass,setPass] = useState("");
  const [err,setErr] = useState("");
  const [busy,setBusy] = useState(false);

  async function go(){
    setErr(""); setBusy(true);
    try{
      const fn = mode === "in" ? "signInWithPassword" : "signUp";
      const { error } = await db.auth[fn]({ email: email.trim(), password: pass });
      if(error) throw error;
      if(mode === "up") setErr("تم إنشاء حسابك! سجّلي دخولك الآن.");
    }catch(e){
      setErr(e.message === "Invalid login credentials"
        ? "البريد أو كلمة السر غير صحيحة"
        : e.message);
    }
    setBusy(false);
  }

  return (
    <div className="center-screen">
      <div className="brand" style={{fontFamily:"Amiri,serif"}}>MamSteps</div>
      <div className="brand-sub">خطوة بخطوة، من أول نبضة</div>

      <div className="card">
        <label>الإيميل</label>
        <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
          placeholder="you@mail.com" autoComplete="email" />
        <label>كلمة السر</label>
        <input type="password" value={pass} onChange={e=>setPass(e.target.value)}
          placeholder="٦ أحرف على الاقل" autoComplete="current-password" />

        {err && <div className={"alert " + (err.includes("تم") ? "alert-ok" : "alert-warn")}>{err}</div>}

        <button className="btn" onClick={go} disabled={busy || !email || pass.length < 6}>
          {busy ? "لحظة..." : mode === "in" ? "دخول" : "إنشاء حساب"}
        </button>
        <button className="btn btn-ghost" onClick={()=>{setMode(mode==="in"?"up":"in");setErr("")}}>
          {mode === "in" ? "ليس لدي حساب — سجّليني" : "لدي حساب — دخول"}
        </button>
        {onBack && <button className="btn btn-ghost" onClick={onBack}>رجوع</button>}
      </div>
      <p className="tiny" style={{textAlign:"center"}}>
        MamSteps يرافقك ويطمئنك، لكنه لا يغني عن طبيبك أبداً.
      </p>
    </div>
  );
}

/* ============ الإعداد الاول ============ */
function Onboard({ user, done }){
  const [step,setStep] = useState(0);
  const [name,setName] = useState("");
  const [country,setCountry] = useState("LB");
  const [dialect,setDialect] = useState("lb");
  const [mode,setMode] = useState("due");
  const [dateVal,setDate] = useState("");
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState("");
  const [joinCode,setJoin] = useState("");
  const [joining,setJoining] = useState(false);
  const [stage,setStage] = useState(null);
  const [babyName,setBabyName] = useState("");
  const [weight,setWeight] = useState("");

  async function join(){
    setBusy(true); setErr("");
    try{
      await db.from("profiles").update({ display_name: name.trim() || "بابا" }).eq("id", user.id);
      const { error } = await db.rpc("join_with_code", { p_code: joinCode });
      if(error) throw error;
      done();
    }catch(e){ setErr(e.message); setBusy(false); }
  }

  async function save(){
    setBusy(true); setErr("");
    try{
      const due = mode === "lmp" ? dueFromLmp(dateVal) : dateVal;

      await db.from("profiles").update({
        display_name: name.trim(), country, dialect
      }).eq("id", user.id);

      const { data: preg, error } = await db.from("pregnancies")
        .insert({ owner_id:user.id, due_date:due, mother_name:name.trim() })
        .select().single();
      if(error) throw error;

      await db.from("pregnancy_members")
        .insert({ pregnancy_id: preg.id, user_id: user.id, member_role:"mother" });

      done();
    }catch(e){ setErr(e.message); setBusy(false); }
  }

  async function saveBorn(){
    setBusy(true); setErr("");
    try{
      await db.from("profiles").update({
        display_name: name.trim(), country, dialect
      }).eq("id", user.id);

      /* نسجّل حملاً منتهياً كحامل للبيانات، ثم المولود */
      const { data: preg, error } = await db.from("pregnancies")
        .insert({ owner_id:user.id, due_date:dateVal, mother_name:name.trim() })
        .select().single();
      if(error) throw error;

      await db.from("pregnancy_members")
        .insert({ pregnancy_id: preg.id, user_id: user.id, member_role:"mother" });

      const { error: e2 } = await db.from("babies").insert({
        pregnancy_id: preg.id, owner_id: user.id,
        name: babyName.trim() || null, birth_date: dateVal,
        birth_weight: weight ? Number(weight) : null });
      if(e2) throw e2;

      done();
    }catch(e){ setErr(e.message); setBusy(false); }
  }

  if(joining) return (
    <div className="center-screen">
      <h1>معك كود دعوة؟</h1>
      <p className="muted" style={{marginBottom:26}}>اكتب اسمك والكود الذي وصلك.</p>
      <div className="card">
        <label>اسمك</label>
        <input value={name} maxLength={20} onChange={e=>setName(e.target.value)}
          placeholder="مثلاً: كريم" />
        <label>كود الدعوة</label>
        <input value={joinCode} maxLength={8}
          onChange={e=>setJoin(e.target.value.toUpperCase())}
          placeholder="ABC123" style={{letterSpacing:3,textAlign:"center",fontSize:20}} />
        {err && <div className="alert alert-warn">{err}</div>}
        <button className="btn" disabled={!joinCode.trim() || busy} onClick={join}>
          {busy ? "لحظة..." : "ادخل"}
        </button>
        <button className="btn btn-ghost" onClick={()=>{setJoining(false);setErr("")}}>رجوع</button>
      </div>
    </div>
  );

  if(stage === null) return (
    <div className="center-screen">
      <div className="brand" style={{fontFamily:"Amiri,serif"}}>MamSteps</div>
      <div className="brand-sub">أين أنت الآن؟</div>
      <div className="card">
        <button className="btn" style={{padding:"22px",fontSize:19,marginBottom:14}}
          onClick={()=>setStage("pregnant")}>
          🤰 أنا حامل
        </button>
        <button className="btn btn-sage" style={{padding:"22px",fontSize:19}}
          onClick={()=>setStage("born")}>
          👶 ولدتُ بالفعل
        </button>
        <p className="tiny" style={{marginTop:14}}>
          يمكنك تغيير ذلك لاحقاً من إعداداتك.
        </p>
        <button className="btn btn-ghost" style={{marginTop:10}}
          onClick={()=>setJoining(true)}>معي كود دعوة</button>
      </div>
    </div>
  );

  /* مسار: ولدت بالفعل */
  if(stage === "born") return (
    <div className="center-screen">
      <h1>مبروك 🤍</h1>
      <p className="muted" style={{marginBottom:26}}>احكي لنا عن مولودك.</p>
      <div className="card">
        <label>اسمك</label>
        <input value={name} maxLength={20} onChange={e=>setName(e.target.value)}
          placeholder="مثلاً: آية" />

        <label>من أين أنت؟</label>
        <div className="row" style={{marginBottom:18}}>
          <button className="pill" data-on={country==="LB"?"1":"0"}
            onClick={()=>{setCountry("LB");setDialect("lb")}}>لبنان</button>
          <button className="pill" data-on={country==="EG"?"1":"0"}
            onClick={()=>{setCountry("EG");setDialect("eg")}}>مصر</button>
          <button className="pill" data-on={country==="OTHER"?"1":"0"}
            onClick={()=>setCountry("OTHER")}>مكان آخر</button>
        </div>

        <label>تاريخ الولادة</label>
        <input type="date" value={dateVal} max={new Date().toISOString().slice(0,10)}
          onChange={e=>setDate(e.target.value)} />

        {dateVal &&
          <div className="alert alert-info">
            عمره الآن: <b>{monthsSince(dateVal) === 0
              ? daysSince(dateVal) + " يوم"
              : monthsSince(dateVal) + " شهر"}</b>
          </div>}

        <label>اسم المولود (اختياري)</label>
        <input value={babyName} maxLength={24} onChange={e=>setBabyName(e.target.value)} />

        <label>وزنه عند الولادة بالكيلو (اختياري)</label>
        <input type="number" step="0.01" value={weight}
          onChange={e=>setWeight(e.target.value)} placeholder="3.2" />

        {err && <div className="alert alert-warn">{err}</div>}

        <button className="btn" disabled={!name.trim() || !dateVal || busy} onClick={saveBorn}>
          {busy ? "لحظة..." : "ابدئي رحلة السنة الأولى"}
        </button>
        <button className="btn btn-ghost" onClick={()=>{setStage(null);setErr("")}}>رجوع</button>
      </div>
    </div>
  );

  if(step === 0) return (
    <div className="center-screen">
      <h1>أهلاً بك 🤍</h1>
      <p className="muted" style={{marginBottom:26}}>ما اسمك؟ جنينك سيناديك به.</p>
      <div className="card">
        <label>اسمك</label>
        <input value={name} maxLength={20} onChange={e=>setName(e.target.value)} placeholder="مثلاً: آية" />
        <label>من أين أنت؟</label>
        <div className="row" style={{marginBottom:18}}>
          <button className="pill" data-on={country==="LB"?"1":"0"}
            onClick={()=>{setCountry("LB");setDialect("lb")}}>لبنان</button>
          <button className="pill" data-on={country==="EG"?"1":"0"}
            onClick={()=>{setCountry("EG");setDialect("eg")}}>مصر</button>
          <button className="pill" data-on={country==="OTHER"?"1":"0"}
            onClick={()=>setCountry("OTHER")}>مكان آخر</button>
        </div>
        <button className="btn" disabled={!name.trim()} onClick={()=>setStep(1)}>لنكمل</button>
        <button className="btn btn-ghost" onClick={()=>setStage(null)}>رجوع</button>
      </div>
    </div>
  );

  return (
    <div className="center-screen">
      <h1>متى موعدك؟</h1>
      <p className="muted" style={{marginBottom:26}}>اختاري الطريقة التي تعرفينها.</p>
      <div className="card">
        <div className="row" style={{marginBottom:18}}>
          <button className="pill" data-on={mode==="due"?"1":"0"} onClick={()=>setMode("due")}>
            الطبيب أخبرني بموعد الولادة
          </button>
          <button className="pill" data-on={mode==="lmp"?"1":"0"} onClick={()=>setMode("lmp")}>
            أعرف أول يوم في آخر دورة
          </button>
        </div>

        <label>{mode==="due" ? "تاريخ الولادة المتوقع" : "أول يوم في آخر دورة"}</label>
        <input type="date" value={dateVal} onChange={e=>setDate(e.target.value)} />

        {mode==="lmp" && dateVal &&
          <div className="alert alert-info">
            موعد ولادتك المتوقع: <b>{dueFromLmp(dateVal)}</b>
          </div>}

        {err && <div className="alert alert-warn">{err}</div>}

        <button className="btn" disabled={!dateVal || busy} onClick={save}>
          {busy ? "لحظة..." : "ابدئي رحلتك"}
        </button>
        <button className="btn btn-ghost" onClick={()=>setStep(0)}>رجوع</button>
        <p className="tiny">يمكنك تعديل التاريخ في أي وقت من إعداداتك.</p>
      </div>
    </div>
  );
}

/* ============ الشاشة الرئيسية ============ */
function Ring({ value, max, label, sub }){
  const R = 58, C = 2 * Math.PI * R;
  const pct = Math.min(1, value / max);
  return (
    <div className="ring">
      <svg width="132" height="132" viewBox="0 0 132 132">
        <circle cx="66" cy="66" r={R} fill="none" stroke="var(--accent-soft)" strokeWidth="11"/>
        <circle cx="66" cy="66" r={R} fill="none" stroke="var(--accent)" strokeWidth="11"
          strokeLinecap="round" strokeDasharray={C}
          strokeDashoffset={C * (1 - pct)}
          style={{transition:"stroke-dashoffset .9s cubic-bezier(.2,.7,.3,1)"}}/>
      </svg>
      <div className="ring-mid">
        <div className="ring-lbl">{label}</div>
        <div className="ring-num">{value}</div>
        <div className="ring-of">{sub}</div>
      </div>
    </div>
  );
}

/* ============ الرسالة الاسبوعية ============ */

function Weekly({ profile, preg, week, role, sub, go }){
  const [msg,setMsg] = useState(null);
  const [load,setLoad] = useState(true);
  const [shown,setShown] = useState(week);
  const [openList,setOpenList] = useState(false);

  /* المشترك بيشوف كل الارشيف · غير المشترك آخر أسبوعين بس */
  const paid = RANK[planOf(sub)] >= 1 && planOf(sub) !== "trial";
  const minWeek = paid ? 1 : Math.max(1, week - 2);

  useEffect(()=>{ setShown(week); },[week]);

  useEffect(()=>{
    if(shown < minWeek){ setShown(week); return; }
    setLoad(true);
    db.from("weekly_messages").select("*")
      .eq("week", shown)
      .eq("audience", role === "father" ? "father" : "mother")
      .eq("dialect", profile.dialect)
      .then(({data})=>{
        if(data && data.length){
          const pick = data.find(r => r.variant === profile.variant_no) || data[0];
          setMsg(pick);
        } else setMsg(null);
        setLoad(false);
      });
  },[shown, role]);

  const who = role === "father"
    ? (preg.father_name || "بابا")
    : (preg.mother_name || profile.display_name);

  const open = [];
  for(let w = week; w >= minWeek; w--) open.push(w);
  const lockedPast = [];
  for(let w = minWeek - 1; w >= 1; w--) lockedPast.push(w);
  const future = [];
  for(let w = week + 1; w <= 40; w++) future.push(w);

  return (
    <div className="screen">
      <div className="hdr"><div>
        <h2>رسالة الاسبوع {shown}</h2>
        <p className="muted">
          {shown === week ? "من جنينك إليك · رسالة هذا الاسبوع"
                          : "رسالة سابقة · أنت الآن في الاسبوع " + week}
        </p>
      </div></div>

      {load ? <div className="spin"></div> :
       !msg ? <div className="card"><p className="muted">
          لا توجد رسالة لهذا الاسبوع بعد. ستكون جاهزة قريباً 🤍
       </p></div> :
      <div className="letter">
        <p>{fillName(msg.body, who)}</p>
        {msg.size_note && shown === week &&
          <p className="tiny" style={{marginTop:12}}>جنينك الآن بحجم {msg.size_note}</p>}
        <div className="from">— {preg.baby_name || "جنينك"} 🤍</div>
      </div>}

      {shown !== week &&
        <button className="btn" onClick={()=>setShown(week)}>العودة لرسالة هذا الاسبوع</button>}

      <button className="btn btn-ghost" onClick={()=>setOpenList(!openList)}>
        {openList ? "إغلاق الرسائل" : "📬 رسائلك السابقة"}
      </button>

      {openList && <>
        <div className="card">
          <h2>رسائل يمكنك قراءتها</h2>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:10}}>
            {open.map(w=>(
              <button key={w} className="pill" data-on={shown===w?"1":"0"}
                style={{flex:"none",minWidth:56,padding:"9px 12px"}}
                onClick={()=>{ setShown(w); window.scrollTo({top:0,behavior:"smooth"}); }}>
                {w}
              </button>
            ))}
          </div>
        </div>

        {lockedPast.length > 0 &&
          <div className="card" style={{borderColor:"var(--accent)"}}>
            <h2>🔒 {lockedPast.length} رسالة سابقة</h2>
            <p className="muted" style={{marginBottom:14}}>
              كل الرسائل التي كتبها جنينك من الاسبوع ١ حتى الآن — تُفتح مع الاشتراك.
            </p>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>
              {lockedPast.slice(0,14).map(w=>(
                <span key={w} className="pill" style={{flex:"none",minWidth:56,
                  padding:"9px 12px",opacity:.4,display:"inline-block",textAlign:"center"}}>
                  🔒 {w}
                </span>
              ))}
            </div>
            <button className="btn" onClick={go}>افتحي كل الرسائل</button>
          </div>}

/* ============ الاشتراك والدفع ============ */
function Billing({ user, profile, sub, reload }){
  const [prices,setPrices] = useState([]);
  const [methods,setMethods] = useState([]);
  const [plan,setPlan] = useState(null);
  const [method,setMethod] = useState(null);
  const [ref,setRef] = useState("");
  const [file,setFile] = useState(null);
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState("");
  const [reqs,setReqs] = useState([]);

  async function load_(){
    const c = profile.country;
    const p = await db.from("plan_prices").select("*")
      .eq("country", c).eq("is_active", true).order("sort_order");
    setPrices(p.data || []);
    const m = await db.from("payment_methods").select("*")
      .eq("country", c).eq("is_active", true).order("sort_order");
    setMethods(m.data || []);
    const r = await db.from("payment_requests").select("*")
      .eq("user_id", user.id).order("created_at",{ascending:false}).limit(5);
    setReqs(r.data || []);
  }
  useEffect(()=>{ load_(); },[]);

  async function submit(){
    if(!plan || !method || !ref.trim()) return;
    setBusy(true); setMsg("");
    try{
      let path = null;
      if(file){
        path = user.id + "/" + Date.now() + "_receipt.jpg";
        const small = await shrink(file, 1400);
        const { error } = await db.storage.from("receipts").upload(path, small);
        if(error) throw error;
      }
      const p = prices.find(x=>x.plan===plan.plan);
      const { error } = await db.from("payment_requests").insert({
        user_id:user.id, plan:plan.plan, country:profile.country,
        method_name:method.method_name,
        amount: p ? (p.price_local || p.price_usd) : null,
        currency: p ? p.currency : null,
        months: p ? p.months : 1,
        reference: ref.trim(), receipt_path: path, status:"pending" });
      if(error) throw error;
      setMsg("وصلنا طلبك! سنفعّل اشتراكك في أقرب وقت 🤍");
      setPlan(null); setMethod(null); setRef(""); setFile(null);
      load_();
    }catch(e){
      setMsg(String(e.message).includes("duplicate")
        ? "رقم العملية هذا مستخدم من قبل."
        : e.message);
    }
    setBusy(false);
  }

  const exp = sub ? new Date(sub.expires_at) : null;
  const alive = exp && exp > new Date();
  const pending = reqs.filter(r=>r.status==="pending");

  /* شاشة الدفع بعد اختيار الباقة */
  if(plan) return (
    <div className="screen">
      <div className="hdr"><div>
        <h2>{PLAN_INFO[plan.plan]?.name}</h2>
        <p className="muted">{(plan.price_local || plan.price_usd) + " " + plan.currency}</p>
      </div></div>

      {msg && <div className={"alert " + (msg.includes("وصلنا") ? "alert-ok" : "alert-warn")}>{msg}</div>}

      <div className="card">
        <h2>حوّلي المبلغ</h2>
        <p className="muted" style={{marginBottom:14}}>اختاري الطريقة المناسبة لك</p>
        {methods.length === 0 &&
          <div className="alert alert-warn">لا توجد وسيلة دفع متاحة لبلدك حالياً.</div>}
        {methods.map(m=>(
          <div className="plan" key={m.id} data-on={method?.id===m.id?"1":"0"}
            onClick={()=>setMethod(m)}>
            <b>{m.method_name}</b>
            <p style={{fontSize:16,margin:"6px 0"}}>{m.account_info}</p>
            {m.instructions && <p className="tiny">{m.instructions}</p>}
          </div>
        ))}
      </div>

      {method && <div className="card">
        <h2>ثم أكّدي التحويل</h2>
        <label>رقم العملية / المرجع</label>
        <input value={ref} onChange={e=>setRef(e.target.value)} placeholder="من إيصال التحويل" />
        <label>صورة الإيصال (تسرّع التفعيل)</label>
        <input type="file" accept="image/*" onChange={e=>setFile(e.target.files[0])} />
        <button className="btn" onClick={submit} disabled={busy || !ref.trim()}>
          {busy ? "جارٍ الإرسال..." : "أرسلي الطلب"}
        </button>
      </div>}

      <button className="btn btn-ghost" onClick={()=>{setPlan(null);setMethod(null)}}>
        العودة للباقات
      </button>
    </div>
  );

  /* شاشة الباقات */
  return (
    <div className="screen">
      <div className="hdr"><div>
        <h2>اشتراكك</h2>
        <p className="muted">
          {sub && alive
            ? (sub.status === "trial" ? "تجربة مجانية" : PLAN_INFO[sub.plan]?.name || "مجاني")
              + " · لحد " + exp.toLocaleDateString("ar-EG")
            : "ليس لديك اشتراك فعّال"}
        </p>
      </div></div>

      {msg && <div className="alert alert-ok">{msg}</div>}

      {pending.length > 0 &&
        <div className="alert alert-info">⏳ لديك طلب دفع قيد المراجعة — سنفعّله قريباً 🤍</div>}

      {sub && sub.status === "trial" && alive &&
        <div className="alert alert-info">
          تجربتك المجانية تنتهي {exp.toLocaleDateString("ar-EG")} — اختاري باقتك قبلها.
        </div>}

      {prices.length === 0 && <div className="card"><p className="muted">جارٍ تحميل الباقات...</p></div>}

      {prices.map(p=>(
        <div className="plan" key={p.plan}
          style={p.badge ? {borderColor:"var(--accent)",borderWidth:2} : {}}>
          <div className="top">
            <b>{PLAN_INFO[p.plan]?.name}</b>
            <span className="price">{(p.price_local || p.price_usd) + " " + p.currency}</span>
          </div>
          {p.badge && <p className="tiny" style={{color:"var(--accent)",fontWeight:700}}>⭐ {p.badge}</p>}
          <p className="tiny">{p.months > 1 ? "لمدة " + p.months + " أشهر" : "شهرياً"}</p>
          <ul style={{margin:"10px 0"}}>
            {(PLAN_INFO[p.plan]?.items||[]).map((it,i)=><li key={i}>{it}</li>)}
          </ul>
          <button className="btn" style={{marginTop:6}} onClick={()=>{setPlan(p);setMsg("")}}>
            اشتركي بهذه الباقة
          </button>
        </div>
      ))}

      {reqs.length > 0 && <>
        <h2 style={{margin:"22px 0 12px"}}>طلباتك السابقة</h2>
        {reqs.map(r=>(
          <div className="req" key={r.id}>
            <b>{PLAN_INFO[r.plan]?.name}</b> · {r.amount} {r.currency}
            <p className="tiny">
              {r.status === "pending" ? "⏳ قيد المراجعة"
               : r.status === "approved" ? "✅ تم التفعيل" : "❌ مرفوض"}
              {r.admin_note ? " — " + r.admin_note : ""}
            </p>
          </div>
        ))}
      </>}
    </div>
  );
}

/* ============ الشات ============ */
function Chat({ user, profile, preg, week, sub, go }){
  const [mode,setMode] = useState("assistant");
  const [msgs,setMsgs] = useState([]);
  const [text,setText] = useState("");
  const [busy,setBusy] = useState(false);
  const [info,setInfo] = useState("");
  const endRef = useRef(null);

  const babyMode = mode === "baby";
  const canBaby = can(sub, "babychat");

  async function load_(){
    const table = babyMode ? "baby_chat" : "chat_messages";
    const { data } = await db.from(table).select("*")
      .eq("user_id", user.id).order("created_at",{ascending:true}).limit(40);
    setMsgs((data||[]).map(m=>({
      role: (m.role === "assistant" || m.role === "baby") ? "assistant" : "user",
      content: m.content })));
  }
  useEffect(()=>{ load_(); },[mode]);
  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:"smooth"}); },[msgs,busy]);

  async function send(){
    const content = text.trim();
    if(!content || busy) return;

    const next = [...msgs, { role:"user", content }];
    setMsgs(next); setText(""); setBusy(true); setInfo("");

    const table = babyMode ? "baby_chat" : "chat_messages";
    await db.from(table).insert({
      user_id:user.id, pregnancy_id:preg.id, role:"user", content,
      ...(babyMode ? { week } : {}) });

    try{
      const { data:{ session } } = await db.auth.getSession();
      const res = await fetch(SUPABASE_URL + "/functions/v1/chat", {
        method:"POST",
        headers:{ "Content-Type":"application/json",
                  "Authorization":"Bearer " + session.access_token },
        body: JSON.stringify({
          message: content,
          history: next.slice(-6).map(m=>({role:m.role, content:m.content})),
          week, dialect: profile.dialect,
          name: profile.display_name,
          babyName: preg.baby_name || "",
          persona: preg.baby_persona || "warm",
          mode })
      });
      const out = await res.json();

      if(out.limit_reached){
        setInfo("انتهت رسائلك لهذا الشهر (" + out.limit + "). يمكنك ترقية باقتك.");
        setBusy(false); return;
      }
      if(out.error) throw new Error(out.error);

      setMsgs(m=>[...m, { role:"assistant", content: out.reply }]);
      await db.from(table).insert({
        user_id:user.id, pregnancy_id:preg.id,
        role: babyMode ? "baby" : "assistant", content: out.reply,
        ...(babyMode ? { week } : {}) });

      if(out.limit - out.used <= 3)
        setInfo("باقٍ " + (out.limit - out.used) + " رسائل هذا الشهر");

    }catch(e){
      setMsgs(m=>[...m, { role:"error", content: String(e.message || e) }]);
    }
    setBusy(false);
  }

  return (
    <div className="screen" style={{paddingBottom:20}}>
      <div className="hdr"><div>
        <h2>{babyMode ? "جنينك يردّ" : "اسألي"}</h2>
        <p className="muted">أسبوع {week}</p>
      </div></div>

      <div className="row" style={{marginBottom:14}}>
        <button className="pill" data-on={!babyMode?"1":"0"} onClick={()=>setMode("assistant")}>
          اسألي</button>
        <button className="pill" data-on={babyMode?"1":"0"} onClick={()=>setMode("baby")}>
          جنينك يردّ {!canBaby && "🔒"}</button>
      </div>

      {babyMode && !canBaby
        ? <Locked what="دردشة الجنين" need="الكاملة" go={go} />
        : <>
            <div className="card" style={{minHeight:280,display:"flex",
              flexDirection:"column",gap:10,padding:16}}>
              {msgs.length === 0 &&
                <p className="muted" style={{textAlign:"center",padding:"40px 10px"}}>
                  {babyMode ? "اكتبي له شيئاً، سيردّ عليك 🤍"
                            : "اسأليني أي شيء عن حملك"}
                </p>}
              {msgs.map((m,i)=>(
                <div key={i} style={{
                  alignSelf: m.role==="user" ? "flex-end" : "flex-start",
                  maxWidth:"85%", padding:"11px 15px", borderRadius:16, fontSize:16,
                  whiteSpace:"pre-wrap", lineHeight:1.9,
                  background: m.role==="user" ? "var(--accent)"
                            : m.role==="error" ? "#FDF0ED" : "var(--accent-soft)",
                  color: m.role==="user" ? "#fff" : "var(--ink)",
                  borderTopRightRadius: m.role==="user" ? 5 : 16,
                  borderTopLeftRadius: m.role==="user" ? 16 : 5
                }}>{m.content}</div>
              ))}
              {busy && <p className="muted" style={{alignSelf:"flex-start"}}>يكتب الآن...</p>}
              <div ref={endRef}></div>
            </div>

            {info && <div className="alert alert-info">{info}</div>}

            <div style={{display:"flex",gap:8}}>
              <input style={{marginBottom:0}} value={text} placeholder="اكتبي سؤالك..."
                onChange={e=>setText(e.target.value)}
                onKeyDown={e=>{ if(e.key==="Enter") send(); }} />
              <button className="btn" style={{width:"auto",padding:"0 22px",marginBottom:0}}
                onClick={send} disabled={busy || !text.trim()}>أرسلي</button>
            </div>

            <p className="tiny" style={{marginTop:12}}>
              MamSteps يقدّم معلومات عامة فقط. لأي عرَض أو قلق حقيقي — طبيبك هو المرجع.
            </p>
          </>}
    </div>
  );
}

/* ============ صلاحيات الباقات ============ */
const RANK = { free:0, trial:1, basic:1, family:2, full:3, lifetime:3 };
const NEEDS = { album:2, father:2, tools:1, babychat:3 };

function planOf(sub){
  if(!sub) return "free";
  const alive = new Date(sub.expires_at) > new Date();
  if(!alive) return "free";
  if(sub.status === "trial") return "trial";   /* التجربة = مستوى الاساسية */
  return sub.plan;
}
function can(sub, feature){
  return RANK[planOf(sub)] >= (NEEDS[feature] || 0);
}
function trialDaysLeft(sub){
  if(!sub || sub.status !== "trial") return null;
  const d = Math.ceil((new Date(sub.expires_at) - new Date()) / DAY);
  return d > 0 ? d : 0;
}

async function shrink(file, max){
  const img = await new Promise((res,rej)=>{
    const i = new Image();
    i.onload = ()=>res(i); i.onerror = rej;
    i.src = URL.createObjectURL(file);
  });
  const scale = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale);
  c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
}

function Album({ user, preg, week, sub, go }){
  const [rows,setRows] = useState([]);
  const [urls,setUrls] = useState({});
  const [busy,setBusy] = useState(false);
  const [kind,setKind] = useState("bump");
  const [msg,setMsg] = useState("");
  const fileRef = useRef(null);

  async function load_(){
    const { data } = await db.from("album_photos").select("*")
      .eq("pregnancy_id", preg.id).order("week",{ascending:false});
    setRows(data || []);
    const map = {};
    for(const r of (data||[])){
      const { data:s } = await db.storage.from("album").createSignedUrl(r.photo_path, 3600);
      if(s) map[r.id] = s.signedUrl;
    }
    setUrls(map);
  }
  useEffect(()=>{ if(can(sub,"album")) load_(); },[]);

  if(!can(sub,"album")) return (
    <div className="screen">
      <div className="hdr"><div><h2>ألبومي</h2></div></div>
      <Locked what="ألبوم التصوير الاسبوعي" need="العائلية" go={go} />
    </div>
  );

  async function upload(e){
    const f = e.target.files[0];
    if(!f) return;
    setBusy(true); setMsg("");
    try{
      const small = await shrink(f, 1200);
      const path = user.id + "/" + preg.id + "-w" + week + "-" + Date.now() + ".jpg";
      const { error } = await db.storage.from("album").upload(path, small);
      if(error) throw error;
      await db.from("album_photos").insert({
        pregnancy_id: preg.id, user_id: user.id, week, photo_path: path, photo_type: kind });
      setMsg("حُفظت 🤍"); load_();
    }catch(err){ setMsg(err.message); }
    setBusy(false);
    if(fileRef.current) fileRef.current.value = "";
  }

  async function del(r){
    await db.storage.from("album").remove([r.photo_path]);
    await db.from("album_photos").delete().eq("id", r.id);
    load_();
  }

  const last = rows.find(r => r.photo_type === "bump");

  return (
    <div className="screen">
      <div className="hdr"><div>
        <h2>ألبومي</h2>
        <p className="muted">{rows.length} صورة · أسبوع {week}</p>

      <div className="card">
        <div className="row" style={{marginBottom:16}}>
          <button className="pill" data-on={kind==="bump"?"1":"0"}
            onClick={()=>setKind("bump")}>صورة بطن</button>
          <button className="pill" data-on={kind==="ultrasound"?"1":"0"}
            onClick={()=>setKind("ultrasound")}>سونار</button>
        </div>

        {kind === "bump" && last && urls[last.id] &&
          <div style={{position:"relative",marginBottom:14}}>
            <img src={urls[last.id]} alt="" style={{width:"100%",borderRadius:14,opacity:.32}} />
            <p className="tiny" style={{textAlign:"center",marginTop:6}}>
              صورة أسبوع {last.week} — قفي بنفس الوضعية ليظهر التغيّر جميلاً في النهاية
            </p>
          </div>}

        <input ref={fileRef} type="file" accept="image/*" onChange={upload} disabled={busy} />
        {busy && <div className="spin"></div>}
        <p className="tiny">تُصغَّر الصور تلقائياً — يوفّر مساحتك</p>
      </div>

      {rows.map(r=>(
        <div className="card" key={r.id}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
            <b>أسبوع {r.week}</b>
            <span className="tiny">{r.photo_type === "bump" ? "بطن" : "سونار"}</span>
          </div>
          {urls[r.id]

            : <div className="spin"></div>}

function Kicks({ user, preg }){

  const [now,setNow] = useState(Date.now());

  async function load_(){
    const { data } = await db.from("kick_sessions").select("*")
      .eq("pregnancy_id", preg.id).order("started_at",{ascending:false}).limit(7);
    setHist(data || []);
  }

  useEffect(()=>{
    if(!start) return;
    const i = setInterval(()=>setNow(Date.now()), 1000);
    return ()=>clearInterval(i);
  },[start]);

  function tap(){
    if(!start) setStart(Date.now());
    setCount(count + 1);
  }
  async function finish(){
    if(!start) return;
    await db.from("kick_sessions").insert({
      pregnancy_id: preg.id, user_id: user.id, kick_count: count,
      started_at: new Date(start).toISOString(), ended_at: new Date().toISOString() });

function Contractions({ user, preg }){
  const [list,setList] = useState([]);

  async function load_(){
    const { data } = await db.from("contractions").select("*")
      .eq("pregnancy_id", preg.id).order("started_at",{ascending:false}).limit(12);

  },[on]);

  async function stop(){
    await db.from("contractions").insert({
      pregnancy_id: preg.id, user_id: user.id,
      started_at: new Date(on).toISOString(),
      duration_sec: Math.round((Date.now() - on) / 1000) });

          {on ? "انتهى الانقباض" : "بدأ انقباض"}
        </button>
      </div>

      {regular &&
        <div className="alert alert-warn">

        <div style={{marginTop:12}}>
          {list.map((c,i)=>(
            <div className="req" key={c.id}>
              <b>{c.duration_sec}ث</b>

            </div>

      </div>}

      <div className="alert alert-info">
        القاعدة المشهورة: انقباض كل ٥ دقائق، بيدوم دقيقة، ومستمر ساعة — وقتها روحي.

/* ============ تنبيه الطلبات الجديدة ============ */
function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [880, 1170];
    notes.forEach((f,i)=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.start(t); o.stop(t + 0.18);
    });
  }catch(e){}
}

function useAdminAlerts(active){
  const [counts,setCounts] = useState({ reqs:0, tickets:0 });
  const prev = useRef(null);
  const [flash,setFlash] = useState(null);

  useEffect(()=>{
    if(!active) return;
    let stop = false;

    async function tick(){
      const a = await db.from("payment_requests")
        .select("id", { count:"exact", head:true }).eq("status","pending");
      const b = await db.from("support_tickets")
        .select("id", { count:"exact", head:true }).eq("status","open");
      if(stop) return;

      const now = { reqs: a.count || 0, tickets: b.count || 0 };
      setCounts(now);

      if(prev.current){
        const newReqs = now.reqs - prev.current.reqs;
        const newTix  = now.tickets - prev.current.tickets;
        if(newReqs > 0 || newTix > 0){
          beep();
          setFlash(newReqs > 0
            ? "💰 وصلك " + newReqs + " طلب دفع جديد"
            : "✉️ وصلك " + newTix + " رسالة دعم جديدة");
          if(document.hidden) document.title = "(" + (now.reqs + now.tickets) + ") MamSteps";
          setTimeout(()=>setFlash(null), 12000);
        }
      }
      prev.current = now;
    }

    tick();
    const id = setInterval(tick, 25000);
    const onFocus = ()=>{ document.title = "MamSteps — خطوة بخطوة، من أول نبضة"; };
    window.addEventListener("focus", onFocus);
    return ()=>{ stop = true; clearInterval(id); window.removeEventListener("focus", onFocus); };
  },[active]);

  return { counts, flash, clear:()=>setFlash(null) };
}

function csvDownload(name, rows){
  if(!rows.length) return;
  const cols = Object.keys(rows[0]);
  const body = rows.map(r => cols.map(c =>
    '"' + String(r[c] ?? "").replace(/"/g,'""') + '"').join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + cols.join(",") + "\n" + body], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + ".csv";
  a.click();
}

function AdminReqs(){

  const [note,setNote] = useState({});

  async function load_(){
    setLoad(true);
    const { data } = await db.from("payment_requests").select("*")
      .eq("status","pending").order("created_at",{ascending:false});
    setReqs(data || []); setLoad(false);
  }
  useEffect(()=>{ load_(); },[]);

  async function decide(r, status){
    await db.from("payment_requests")
      .update({ status, admin_note: note[r.id] || null }).eq("id", r.id);
    load_();
  }

  async function viewReceipt(path){
    const { data } = await db.storage.from("receipts").createSignedUrl(path, 300);
    if(data) window.open(data.signedUrl, "_blank");

  if(load) return <div className="spin"></div>;
  if(!reqs.length) return <div className="card"><p className="muted">لا توجد طلبات جديدة ✅</p></div>;

  return reqs.map(r=>(
    <div className="card" key={r.id}>
      <b>{PLAN_INFO[r.plan]?.name}</b> · {r.amount} {r.currency}
      <p className="tiny">{r.method_name} · مرجع: {r.reference}</p>
      <p className="tiny">{new Date(r.created_at).toLocaleString("ar-EG")}</p>

      {r.receipt_path &&
        <button className="btn btn-ghost" style={{marginTop:10}}
          onClick={()=>viewReceipt(r.receipt_path)}>شوف الإيصال</button>}

      <div className="row">
        <button className="btn btn-sage btn-sm" onClick={()=>decide(r,"approved")}>موافقة</button>
        <button className="btn btn-danger btn-sm" onClick={()=>decide(r,"rejected")}>رفض</button>
      </div>
    </div>
  ));

function AdminUsers(){

  const [err,setErr] = useState("");
  const [note,setNote] = useState("");
  const [q,setQ] = useState("");

  async function load_(){
    setLoad(true);
    const { data, error } = await db.rpc("admin_users");
    if(error) setErr(error.message); else setRows(data || []);
    setLoad(false);
  }
  useEffect(()=>{ load_(); },[]);

  async function give(u, plan){
    const { error } = await db.rpc("admin_set_plan",
      { p_user:u.user_id, p_plan:plan, p_months:1 });
    if(error){ setErr(error.message); return; }
    setNote("تم تفعيل " + PLAN_INFO[plan].name + " لـ " + (u.display_name || "المستخدم"));
    setTimeout(()=>setNote(""), 2500);
    await load_();
  }
  async function extend(u){
    await db.rpc("admin_extend", { p_user:u.user_id, p_days:7 });
    setNote("تم تمديد ٧ أيام");
    setTimeout(()=>setNote(""), 2500);
    await load_();
  }
  async function freeze(u){
    await db.rpc("admin_freeze", { p_user:u.user_id, p_state: !u.is_frozen });
    await load_();
  }

  if(err)  return <div className="alert alert-warn">{err}</div>;
  if(load) return <div className="spin"></div>;

  const t = q.trim().toLowerCase();
  const list = rows.filter(r => !t ||
    (r.display_name||"").toLowerCase().includes(t) ||
    (r.email||"").toLowerCase().includes(t) ||
    (r.country||"").toLowerCase().includes(t));

  return (
    <>
      {note && <div className="alert alert-ok">{note}</div>}
      <input placeholder="دوّر باسم أو إيميل أو بلد" value={q} onChange={e=>setQ(e.target.value)} />

        <p className="tiny">{list.length} مستخدم</p>

          onClick={()=>csvDownload("users", list)}>نزّل Excel</button>
      </div>

      {list.map(u=>{
        const live = u.status === "active" && new Date(u.expires_at) > new Date();
        return (
        <div className="card" key={u.user_id}
          style={u.is_frozen ? {opacity:.6,borderColor:"var(--danger)"} : {}}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <b>{u.display_name || "بلا اسم"}</b>
            <span className="tiny">{u.country}{u.is_frozen ? " · مجمّد" : ""}</span>
          </div>
          <p className="tiny">{u.email}</p>
          <p className="tiny">
            {PLAN_INFO[u.plan]?.name || "مجاني"} ·{" "}
            {u.status === "active" ? "مشترك" : u.status === "trial" ? "تجربة" : "منتهي"}
            {u.expires_at && " · لحد " + new Date(u.expires_at).toLocaleDateString("ar-EG")}
          </p>
          {u.week_now && <p className="tiny">أسبوع {u.week_now} · ولادة {u.due_date}</p>}
          <p className="tiny">سجّل: {new Date(u.joined).toLocaleDateString("ar-EG")}</p>

          <div className="row" style={{marginTop:10}}>
            {["basic","family","full"].map(p=>(
              <button key={p} className="pill" data-on={(live && u.plan===p)?"1":"0"}
                style={{padding:"10px 6px",fontSize:14}}
                onClick={()=>give(u,p)}>{PLAN_INFO[p].name}</button>
            ))}
          </div>
          <div className="row" style={{marginTop:8}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>extend(u)}>+٧ أيام</button>
            <button className="btn btn-danger btn-sm" onClick={()=>freeze(u)}>
              {u.is_frozen ? "فك التجميد" : "تجميد"}
            </button>
          </div>
        </div>
      );})}
    </>
  );
}

function AdminPricing(){
  const [rows,setRows] = useState([]);
  const [meths,setMeths] = useState([]);
  const [edit,setEdit] = useState({});
  const [msg,setMsg] = useState("");
  const [load,setLoad] = useState(true);
  const COUNTRY = { LB:"لبنان", EG:"مصر", OTHER:"باقي الدول" };

  async function load_(){
    setLoad(true);
    const a = await db.rpc("admin_prices");
    setRows(a.data || []);
    const b = await db.from("payment_methods").select("*").order("country");
    setMeths(b.data || []);
    setLoad(false);
  }
  useEffect(()=>{ load_(); },[]);

  function key(r){ return r.plan + "|" + r.country; }
  function val(r, field){
    const k = key(r);
    return edit[k]?.[field] !== undefined ? edit[k][field] : r[field];
  }
  function set(r, field, v){
    const k = key(r);
    setEdit({ ...edit, [k]: { ...(edit[k]||{}), [field]: v } });
  }

  async function save(r){
    const { error } = await db.rpc("admin_update_price", {
      p_plan: r.plan, p_country: r.country,
      p_usd: Number(val(r,"price_usd")),
      p_local: Number(val(r,"price_local")),
      p_currency: val(r,"currency"),
      p_badge: val(r,"badge") || null,
      p_active: val(r,"is_active")
    });
    setMsg(error ? error.message : "حُفظ ✅");
    setTimeout(()=>setMsg(""), 2500);
    setEdit({}); load_();
  }

  async function saveMethod(m, patch){
    await db.from("payment_methods").update(patch).eq("id", m.id);
    setMsg("حُفظ ✅"); setTimeout(()=>setMsg(""), 2500);
    load_();
  }

  if(load) return <div className="spin"></div>;

  return (
    <>
      {msg && <div className={"alert " + (msg.includes("✅") ? "alert-ok" : "alert-warn")}>{msg}</div>}

      {Object.keys(COUNTRY).map(c=>(
        <div className="card" key={c}>
          <h2>أسعار {COUNTRY[c]}</h2>
          <div style={{marginTop:14}}>
            {rows.filter(r=>r.country===c).map(r=>(
              <div key={key(r)} style={{paddingBottom:16,marginBottom:16,
                borderBottom:"1px solid var(--line)"}}>
                <b>{PLAN_INFO[r.plan]?.name || r.plan}</b>
                {r.months > 1 && <span className="tiny"> · {r.months} تشهر</span>}

                <div className="row" style={{marginTop:10}}>
                  <div style={{flex:1}}>
                    <label>السعر المحلي</label>
                    <input type="number" style={{marginBottom:8}}
                      value={val(r,"price_local") ?? ""}
                      onChange={e=>set(r,"price_local",e.target.value)} />
                  </div>
                  <div style={{flex:1}}>
                    <label>العملة</label>
                    <input style={{marginBottom:8}} value={val(r,"currency") ?? ""}
                      onChange={e=>set(r,"currency",e.target.value)} />
                  </div>
                </div>

                <label>بالدولار (للحسابات)</label>
                <input type="number" style={{marginBottom:8}} value={val(r,"price_usd") ?? ""}
                  onChange={e=>set(r,"price_usd",e.target.value)} />

                <label>شارة مميزة (اتركها فارغة إن لم ترد)</label>
                <input style={{marginBottom:8}} value={val(r,"badge") ?? ""}
                  placeholder="مثلاً: الاوفر" onChange={e=>set(r,"badge",e.target.value)} />

                <div className="row">
                  <button className="pill" data-on={val(r,"is_active")?"1":"0"}
                    onClick={()=>set(r,"is_active",!val(r,"is_active"))}>
                    {val(r,"is_active") ? "ظاهرة ✅" : "مخفية"}
                  </button>
                  <button className="btn btn-sage btn-sm" onClick={()=>save(r)}>احفظ</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}

      <div className="card">
        <h2>وسائل الدفع</h2>
        <p className="muted" style={{marginBottom:14}}>هون بتحط أرقامك الحقيقية</p>
        {meths.map(m=>(
          <div key={m.id} style={{paddingBottom:16,marginBottom:16,
            borderBottom:"1px solid var(--line)"}}>
            <b>{m.method_name}</b> <span className="tiny">· {COUNTRY[m.country]}</span>
            <label style={{marginTop:8}}>الرقم / الحساب</label>
            <input defaultValue={m.account_info} style={{marginBottom:8}}
              onBlur={e=>{ if(e.target.value !== m.account_info)
                saveMethod(m,{account_info:e.target.value}); }} />
            <label>التعليمات</label>
            <input defaultValue={m.instructions || ""} style={{marginBottom:8}}
              onBlur={e=>{ if(e.target.value !== m.instructions)
                saveMethod(m,{instructions:e.target.value}); }} />
            <button className="pill" data-on={m.is_active?"1":"0"}
              onClick={()=>saveMethod(m,{is_active:!m.is_active})}>
              {m.is_active ? "شغّالة ✅" : "متوقفة"}
            </button>
          </div>
        ))}
        <p className="tiny">التعديل بينحفظ لما تطلع من الخانة</p>
      </div>
    </>
  );
}

function AdminContent(){
  const [tab,setTab] = useState("serenity");
  const [rows,setRows] = useState([]);
  const [msg,setMsg] = useState("");

  /* نموذج الإضافة */
  const [body,setBody] = useState("");
  const [ref,setRef] = useState("");
  const [kind,setKind] = useState("verse");
  const [cat,setCat] = useState("peace");
  const [title,setTitle] = useState("");
  const [dialect,setDialect] = useState("lb");
  const [aud,setAud] = useState("mother");

  const TABLE = { serenity:"serenity", stories:"stories", surprise:"surprise_messages" };

  async function load_(){
    const { data } = await db.from(TABLE[tab]).select("*").limit(200);
    setRows(data || []);
  }
  useEffect(()=>{ load_(); },[tab]);

  function flash(t){ setMsg(t); setTimeout(()=>setMsg(""), 2500); }

  async function add(){
    if(!body.trim()) return;
    let row;
    if(tab === "serenity")
      row = { body: body.trim(), reference: ref.trim() || null, kind, category: cat };
    else if(tab === "stories")
      row = { body: body.trim(), title: title.trim() || "بلا عنوان", dialect, minutes: 2 };
    else
      row = { body: body.trim(), dialect, audience: aud, min_week: 1, max_week: 42 };

    const { error } = await db.from(TABLE[tab]).insert(row);
    flash(error ? error.message : "انضاف ✅");
    setBody(""); setRef(""); setTitle(""); load_();
  }

  async function toggle(r){
    await db.from(TABLE[tab]).update({ is_active: !r.is_active }).eq("id", r.id);
    load_();
  }
  async function del(r){
    await db.from(TABLE[tab]).delete().eq("id", r.id);
    flash("انحذف"); load_();
  }

  return (
    <>
      {msg && <div className={"alert " + (msg.includes("✅")||msg.includes("انحذف")
        ? "alert-ok" : "alert-warn")}>{msg}</div>}

      <div className="row" style={{marginBottom:18}}>
        <button className="pill" data-on={tab==="serenity"?"1":"0"}
          onClick={()=>setTab("serenity")}>سكينة</button>
        <button className="pill" data-on={tab==="stories"?"1":"0"}
          onClick={()=>setTab("stories")}>قصص</button>
        <button className="pill" data-on={tab==="surprise"?"1":"0"}
          onClick={()=>setTab("surprise")}>مفاجآت</button>
      </div>

      <div className="card">
        <h2>إضافة جديدة</h2>

        {tab === "serenity" && <>
          <p className="muted" style={{marginBottom:12}}>
            انسخ الآية من مصحف موثوق (quran.com) والصقها كما هي.
          </p>
          <div className="row" style={{marginBottom:14}}>
            <button className="pill" data-on={kind==="verse"?"1":"0"}
              onClick={()=>setKind("verse")}>آية</button>
            <button className="pill" data-on={kind==="dua"?"1":"0"}
              onClick={()=>setKind("dua")}>دعاء</button>
          </div>
          <label>النص</label>
          <textarea style={{minHeight:90}} value={body} onChange={e=>setBody(e.target.value)} />
          <label>المرجع (مثلاً: البقرة ٢٨٦)</label>
          <input value={ref} onChange={e=>setRef(e.target.value)} />
          <label>التصنيف</label>
          <select value={cat} onChange={e=>setCat(e.target.value)}>
            <option value="peace">طمأنينة</option>
            <option value="patience">صبر</option>
            <option value="gratitude">شكر</option>
            <option value="provision">رزق</option>
            <option value="mercy">رحمة</option>
          </select>
        </>}

        {tab === "stories" && <>
          <label>العنوان</label>
          <input value={title} onChange={e=>setTitle(e.target.value)} />
          <label>اللهجة</label>
          <select value={dialect} onChange={e=>setDialect(e.target.value)}>
            <option value="lb">لبناني</option>
            <option value="eg">مصري</option>
          </select>
          <label>القصة</label>
          <textarea style={{minHeight:150}} value={body} onChange={e=>setBody(e.target.value)} />
        </>}

        {tab === "surprise" && <>
          <div className="row" style={{marginBottom:14}}>
            <button className="pill" data-on={dialect==="lb"?"1":"0"}
              onClick={()=>setDialect("lb")}>لبناني</button>
            <button className="pill" data-on={dialect==="eg"?"1":"0"}
              onClick={()=>setDialect("eg")}>مصري</button>
          </div>
          <div className="row" style={{marginBottom:14}}>
            <button className="pill" data-on={aud==="mother"?"1":"0"}
              onClick={()=>setAud("mother")}>للام</button>
            <button className="pill" data-on={aud==="father"?"1":"0"}
              onClick={()=>setAud("father")}>للاب</button>
          </div>
          <label>الرسالة</label>
          <textarea style={{minHeight:90}} value={body} onChange={e=>setBody(e.target.value)} />
        </>}

        <button className="btn" onClick={add} disabled={!body.trim()}>ضيفها</button>
      </div>

      <h2 style={{margin:"22px 0 12px"}}>الموجود ({rows.length})</h2>
      {rows.map(r=>(
        <div className="card" key={r.id} style={r.is_active === false ? {opacity:.5} : {}}>
          {r.title && <b>{r.title}</b>}
          <p style={{whiteSpace:"pre-wrap",marginTop:6}}>{r.body.slice(0,220)}
            {r.body.length > 220 ? "..." : ""}</p>
          <p className="tiny">
            {r.reference || ""} {r.dialect ? "· " + (r.dialect==="lb"?"لبناني":"مصري") : ""}
            {r.audience ? " · " + (r.audience==="mother"?"للام":"للاب") : ""}
          </p>
          <div className="row" style={{marginTop:10}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>toggle(r)}>
              {r.is_active === false ? "إظهار" : "إخفاء"}
            </button>
            <button className="btn btn-danger btn-sm" onClick={()=>del(r)}>حذف</button>
          </div>
        </div>
      ))}
    </>
  );
}

function AdminTickets(){
  const [rows,setRows] = useState([]);
  const [load,setLoad] = useState(true);
  const [reply,setReply] = useState({});

  async function load_(){
    setLoad(true);
    const { data } = await db.rpc("admin_tickets");
    setRows(data || []); setLoad(false);
  }
  useEffect(()=>{ load_(); },[]);

  async function send(t){
    if(!reply[t.id]?.trim()) return;
    await db.rpc("admin_reply_ticket", { p_id:t.id, p_reply:reply[t.id].trim() });
    setReply({...reply,[t.id]:""});
    load_();
  }

  if(load) return <div className="spin"></div>;
  if(!rows.length) return <div className="card"><p className="muted">لا توجد رسائل ✅</p></div>;

  return rows.map(t=>(
    <div className="card" key={t.id}>
      <div style={{display:"flex",justifyContent:"space-between"}}>
        <b>{t.display_name || "بلا اسم"}</b>
        <span className="tiny">{t.status === "open" ? "🔴 جديدة" : "✅ انرد عليها"}</span>
      </div>
      <p className="tiny">{t.email} · {new Date(t.created_at).toLocaleString("ar-EG")}</p>
      <p style={{margin:"10px 0",whiteSpace:"pre-wrap"}}>{t.body}</p>

      {t.admin_reply &&
        <div className="alert alert-ok" style={{whiteSpace:"pre-wrap"}}>ردك: {t.admin_reply}</div>}

      <textarea style={{minHeight:80}} placeholder="اكتب ردك"
        value={reply[t.id]||""} onChange={e=>setReply({...reply,[t.id]:e.target.value})} />
      <button className="btn btn-sage" onClick={()=>send(t)}>ابعت الرد</button>
    </div>
  ));
}

function AdminAnnounce(){
  const [title,setTitle] = useState("");
  const [body,setBody] = useState("");
  const [list,setList] = useState([]);
  const [msg,setMsg] = useState("");

  async function load_(){
    const { data } = await db.from("announcements").select("*")
      .order("created_at",{ascending:false}).limit(10);
    setList(data || []);
  }
  useEffect(()=>{ load_(); },[]);

  async function publish(){
    if(!title.trim() || !body.trim()) return;
    const { error } = await db.from("announcements")
      .insert({ title:title.trim(), body:body.trim() });
    setMsg(error ? error.message : "تم النشر ✅");
    setTitle(""); setBody(""); load_();
  }

  async function toggle(a){
    await db.from("announcements").update({ is_active: !a.is_active }).eq("id", a.id);
    load_();
  }

  return (
    <>
      {msg && <div className="alert alert-ok">{msg}</div>}
      <div className="card">
        <h2>إعلان جديد</h2>
        <p className="muted" style={{marginBottom:14}}>بيظهر لكل المستخدمين بالشاشة الرئيسية</p>
        <label>العنوان</label>
        <input value={title} maxLength={60} onChange={e=>setTitle(e.target.value)}
          placeholder="مثلاً: ميزة جديدة" />
        <label>النص</label>
        <textarea style={{minHeight:90}} value={body} maxLength={400}
          onChange={e=>setBody(e.target.value)} />
        <button className="btn" onClick={publish} disabled={!title.trim() || !body.trim()}>
          انشر
        </button>
      </div>

      {list.map(a=>(
        <div className="card" key={a.id}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <b>{a.title}</b>
            <span className="tiny">{a.is_active ? "🟢 ظاهر" : "⚪ مخفي"}</span>
          </div>
          <p className="muted">{a.body}</p>
          <button className="btn btn-ghost btn-sm" style={{marginTop:10,width:"100%"}}
            onClick={()=>toggle(a)}>{a.is_active ? "إخفاء" : "إظهار"}</button>
        </div>
      ))}
    </>
  );
}

/* ============ التطبيق ============ */
function App(){
  const [session,setSession] = useState(null);
  const [profile,setProfile] = useState(null);
  const [preg,setPreg] = useState(null);
  const [role,setRole] = useState("mother");
  const [sub,setSub] = useState(null);
  const [tab,setTab] = useState("home");
  const [ready,setReady] = useState(false);
  const [asUser,setAsUser] = useState(false);
  const [adminView,setAdminView] = useState("stats");
  const [baby,setBaby] = useState(null);
  const [authView,setAuthView] = useState(null);

  useEffect(()=>{
    db.auth.getSession().then(({data})=>{ setSession(data.session); if(!data.session) setReady(true); });
    const { data:sc } = db.auth.onAuthStateChange((_e,s)=>{
      setSession(s);
      if(!s){ setProfile(null); setPreg(null); setReady(true); }
    });
    return ()=> sc.subscription.unsubscribe();
  },[]);

  async function loadAll(){
    if(!session) return;
    const uid = session.user.id;
    const { data:p } = await db.from("profiles").select("*").eq("id", uid).single();
    setProfile(p);

    const { data:m } = await db.from("pregnancy_members").select("pregnancy_id, member_role")
      .eq("user_id", uid).limit(1);

    if(m && m.length){
      setRole(m[0].member_role);
      const { data:pr } = await db.from("pregnancies").select("*").eq("id", m[0].pregnancy_id).single();
      setPreg(pr && pr.status !== "ended" ? pr : null);
    } else setPreg(null);

    const { data:s } = await db.from("subscriptions").select("*").eq("user_id", uid).single();
    setSub(s);

    if(m && m.length){
      const { data:b } = await db.from("babies").select("*")
        .eq("pregnancy_id", m[0].pregnancy_id).limit(1);
      setBaby(b && b.length ? b[0] : null);
    } else setBaby(null);

    setReady(true);
  }
  useEffect(()=>{ if(session) loadAll(); },[session]);

  useEffect(()=>{
    const g = preg ? preg.baby_gender : "unknown";
    document.documentElement.style.setProperty("--accent", accentFor(g));
    document.documentElement.style.setProperty("--accent-soft", softFor(g));
  },[preg]);

  const alerts = useAdminAlerts(!!(profile && profile.is_admin && !asUser));
  const [showSurprise,setShowSurprise] = useState(false);

  useEffect(()=>{
    if(!preg || !profile) return;
    const t = setTimeout(()=>{ if(Math.random() < 0.35) setShowSurprise(true); }, 9000);
    return ()=>clearTimeout(t);
  },[preg && preg.id]);

  if(!ready) return <div className="spin"></div>;
  if(!session) return authView
    ? <Auth initial={authView} onBack={()=>setAuthView(null)} />
    : <Landing onStart={()=>setAuthView("up")} onLogin={()=>setAuthView("in")} />;
  if(!profile) return <div className="spin"></div>;

  const isAdmin = profile.is_admin;

  /* الادمن: لوحة التحكم مباشرة */
  if(isAdmin && !asUser){
    return (
      <>
        <Admin view={adminView} setView={setAdminView} alerts={alerts} />
        <div className="tabs">
          <div className="nav-sep">الإدارة</div>
          {ADMIN_SECTIONS.map(s=>{
            const n = s.id === "reqs" ? alerts.counts.reqs
                    : s.id === "tickets" ? alerts.counts.tickets : 0;
            return (
              <button className="tab" key={s.id} data-on={adminView===s.id?"1":"0"}
                onClick={()=>setAdminView(s.id)}>
                <i>{s.icon}</i>{s.label}
                {n > 0 && <span style={{background:"var(--danger)",color:"#fff",
                  borderRadius:99,padding:"1px 8px",fontSize:12,marginInlineStart:6,
                  fontWeight:700}}>{n}</span>}
              </button>
            );
          })}
          <div className="nav-sep">مكان آخر</div>
          <button className="tab" onClick={()=>{ loadAll(); setAsUser(true); setTab("home"); }}>
            <i>👁️</i>شوف كمستخدمة</button>
          <button className="tab" onClick={()=>db.auth.signOut()}>
            <i>🚪</i>خروج</button>
        </div>
      </>
    );
  }

  if(!preg) return <Onboard user={session.user} done={loadAll} />;

  const week = weekFrom(preg.due_date);
  const past = daysLeft(preg.due_date) === 0;

  /* وضع الأمومة بعد الولادة */
  if(baby) return (
    <>
      {tab === "home"    && <BabyHome user={session.user} profile={profile}
                                      baby={baby} reload={loadAll} />}
      {tab === "album"   && <BabyAlbum user={session.user} baby={baby} />}
      {tab === "moments" && <BabyMoments user={session.user} baby={baby} />}
      {tab === "cards"   && <Cards preg={preg} baby={baby} />}
      {tab === "letters" && <Letters user={session.user} preg={preg} week={40} />}
      {tab === "stories" && <Stories profile={profile} />}
      {tab === "serenity"&& <Serenity profile={profile} />}
      {tab === "billing" && <Billing user={session.user} profile={profile} sub={sub} reload={loadAll} />}
      {tab === "me"      && <Settings user={session.user} profile={profile} preg={preg}
                                      sub={sub} role={role} reload={loadAll} baby={baby}
                                      go={(t)=>setTab(t || "billing")} />}

      <Nav tab={tab} setTab={setTab} isAdmin={isAdmin} setAsUser={setAsUser}
        items={[
          ["home","\ud83c\udfe0","الرئيسية"],["album","\ud83d\udcf8","الألبوم"],
          ["moments","\u2b50","أوّل مرات"],["cards","\ud83d\udc8c","بطاقات"],
          ["letters","\ud83e\udd0d","صندوق الرسائل"],["stories","\ud83d\udcd6","قصص"],
          ...(profile.show_serenity !== false ? [["serenity","\ud83d\udd4a\ufe0f","سكينة"]] : []),
          ["billing","\ud83d\udc8e","الباقات"],["me","\u2699\ufe0f","حسابي"]
        ]} />
    </>
  );

  if(!baby && tab === "birth")
    return <BirthForm user={session.user} preg={preg} done={loadAll}
             back={()=>setTab("me")} />;

  return (
    <>
      {showSurprise &&
        <Surprise user={session.user} week={week} role={role}
          onClose={()=>setShowSurprise(false)} />}

      {past && !baby &&
        <div style={{padding:"16px 18px 0"}}>
          <div className="alert alert-info" style={{cursor:"pointer"}}
            onClick={()=>setTab("birth")}>
            🤍 <b>وصل موعدك!</b><br/>سجّلي يوم الولادة لتبدأ رحلة السنة الأولى.
          </div>
        </div>}

      {tab === "home"    && <Home profile={profile} preg={preg} week={week} sub={sub}
                                  go={()=>setTab("billing")} nav={setTab} />}
      {tab === "weekly"  && <Weekly profile={profile} preg={preg} week={week} role={role}
                                    sub={sub} go={()=>setTab("billing")} />}
      {tab === "letters" && <Letters user={session.user} preg={preg} week={week} />}
      {tab === "chat"    && <Chat user={session.user} profile={profile} preg={preg}
                                  week={week} sub={sub} go={()=>setTab("billing")} />}
      {tab === "album"   && <Album user={session.user} preg={preg} week={week} sub={sub}
                                   go={()=>setTab("billing")} />}
      {tab === "tools"   && <Tools user={session.user} preg={preg} sub={sub}
                                   go={()=>setTab("billing")} />}
      {tab === "moments" && <Moments user={session.user} profile={profile} preg={preg} week={week} />}
      {tab === "journey" && <Journey user={session.user} preg={preg} week={week} profile={profile} />}
      {tab === "guide"   && <Guide profile={profile} week={week} />}
      {tab === "names"   && <Names user={session.user} preg={preg} />}
      {tab === "doctorq" && <DoctorQ preg={preg} />}
      {tab === "cards"   && <Cards preg={preg} baby={null} />}
      {tab === "stories" && <Stories profile={profile} />}
      {tab === "serenity"&& <Serenity profile={profile} />}
      {tab === "billing" && <Billing user={session.user} profile={profile} sub={sub} reload={loadAll} />}
      {tab === "me"      && <Settings user={session.user} profile={profile} preg={preg} sub={sub}
                                      role={role} reload={loadAll}
                                      go={(t)=>setTab(t || "billing")} />}

      <Nav tab={tab} setTab={setTab} isAdmin={isAdmin} setAsUser={setAsUser}
        items={[
          ["home","\ud83c\udfe0","الرئيسية"],["weekly","\ud83d\udc8c","رسالة جنينك"],
          ["chat","\ud83d\udcac","اسألي"],["tools","\ud83e\uddf0","أدواتي"],
          ["album","\ud83d\udcf8","ألبومي"],["letters","\ud83e\udd0d","صندوق الرسائل"],
          ["moments","\u2b50","لحظاتي"],["journey","\ud83d\uddfa\ufe0f","قصة حملك"],
          ["guide","\ud83d\udca1","دليلك"],["names","\u2728","اسم المولود"],
          ["doctorq","\ud83d\udccb","أسئلة للطبيب"],["cards","\ud83d\udc8c","بطاقات"],
          ["stories","\ud83d\udcd6","قصص"],
          ...(profile.show_serenity !== false ? [["serenity","\ud83d\udd4a\ufe0f","سكينة"]] : []),
          ["billing","\ud83d\udc8e","الباقات"],["me","\u2699\ufe0f","حسابي"]
        ]} />
    </>
  );
}

/* ============ التنقّل ============ */
function Nav({ tab, setTab, items, isAdmin, setAsUser }){
  const [open,setOpen] = useState(false);
  function go(t){ setTab(t); setOpen(false); window.scrollTo({top:0}); }

  return (
    <>
      {open &&
        <div className="drawer" onClick={()=>setOpen(false)}>
          <div className="drawer-panel" onClick={e=>e.stopPropagation()}>
            <h3 style={{fontFamily:"Amiri,serif"}}>MamSteps</h3>
            {items.map(([k,i,t])=>(
              <button key={k} className="drawer-item" data-on={tab===k?"1":"0"}
                onClick={()=>go(k)}><i>{i}</i>{t}</button>
            ))}
            {isAdmin && <>
              <div className="drawer-sep">الإدارة</div>
              <button className="drawer-item" onClick={()=>setAsUser(false)}>
                <i>📊</i>لوحة التحكم</button>
            </>}
          </div>
        </div>}

      <div className="tabs">
        {items.map(([k,i,t],idx)=>(
          <button key={k} className={"tab" + (idx >= 4 ? " extra" : "")}
            data-on={tab===k?"1":"0"} onClick={()=>go(k)}>
            <i>{i}</i>{t}
          </button>
        ))}
        {isAdmin &&
          <button className="tab extra" onClick={()=>setAsUser(false)}>
            <i>📊</i>لوحة التحكم</button>}
        <button className="tab menu-btn" onClick={()=>setOpen(true)}>
          <i>☰</i>المزيد</button>
      </div>
    </>
  );
}

        + '<h2>ما قدرنا نحمّل التطبيق</h2>'
        + '<p style="color:#6B7C8C">جرّب تعمل تحديث للصفحة، أو افتحها من متصفح تاني.</p>'
        + '<p style="color:#D9634F;font-size:13px;margin-top:14px">' + e.message + '</p></div>';
    }
  }

  function ready(){
    if(window.Babel && window.React && window.ReactDOM && window.supabase) return boot();

    // محاولة تحميل بديلة لو المصدر الاساسي انحجب
    const alt = document.createElement("script");
    alt.src = "https://unpkg.com/@babel/standalone/babel.min.js";
    alt.onload = boot;
    alt.onerror = function(){
      document.getElementById("root").innerHTML =
        '<div style="padding:40px;text-align:center;font-family:Tajawal,sans-serif">'
        + '<h2>ما قدرنا نحمّل التطبيق</h2>'
        + '<p style="color:#6B7C8C">تأكد من الإنترنت وجرّب تحدّث الصفحة.</p></div>';
    };
    document.body.appendChild(alt);
  }

  if(document.readyState === "complete") ready();
  else window.addEventListener("load", ready);
})();
</script>
</body>
</html>
